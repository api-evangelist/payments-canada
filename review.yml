actions:
  openapiHarvested: true
  openapiCount: 4
  apisYmlUpdated: true
  reason: |
    A real first-party developer portal with publicly downloadable OpenAPI
    specifications was confirmed. Four RTR sandbox OpenAPI 3.0.3 documents were
    harvested verbatim into openapi/, and ten documented API products were
    recorded as apis[] entries with verified humanURLs. Posture recorded
    honestly: payments-rail operator (not a bank, not an open-banking / FDX /
    1033 data provider); OAuth2 client-credentials auth; production gated.
