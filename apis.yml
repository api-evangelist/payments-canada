aid: payments-canada
url: https://raw.githubusercontent.com/api-evangelist/payments-canada/refs/heads/main/apis.yml
name: Payments Canada
kind: company
description: >-
  Payments Canada (formerly the Canadian Payments Association) is the public-purpose
  organization created by federal statute (the Canadian Payments Act) that owns and
  operates Canada's core national payment clearing and settlement infrastructure,
  under the oversight of the Bank of Canada and the Minister of Finance. Its members
  are Canada's financial institutions. It operates Lynx (the high-value, ISO 20022
  real-time gross settlement system that replaced LVTS), the Automated Clearing
  Settlement System (ACSS, Canada's retail batch/ACH rail), and is building the
  Real-Time Rail (RTR) — a 24/7/365 irrevocable faster-payments system fully based
  on the ISO 20022 messaging standard. Payments Canada is payments infrastructure,
  distinct from Canada's Consumer-Driven Banking (open banking) framework, which is
  legislated but not yet operational and overseen by the FCAC. It runs a real,
  publicly registerable API developer portal (developer.payments.ca, launched
  February 19, 2020) exposing member/registered-user sandbox and data-extract APIs
  — including downloadable RTR sandbox OpenAPI specifications — secured with OAuth2
  client-credentials (Consumer Key/Secret via Apigee); production access is
  license/agreement gated.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
