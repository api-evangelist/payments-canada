apis:
- aid: payments-canada:rtr-inbound-participant-payment-api
  name: RTR Sandbox - Inbound Participant Payment API
  description: >-
    Real-Time Rail sandbox API for sending an RTR payment (ISO 20022 pacs.008
    Customer Credit Transfer) to another RTR participant and enquiring on payment
    status (pacs.028), returning a payment status report (pacs.002) or message
    reject (admi.002). OAuth2 client-credentials; OpenAPI 3.0.3 harvested verbatim
    from the developer portal Swagger UI.
  humanURL: https://developer.payments.ca/rtr-sandbox-api/apis
  baseURL: https://api.payments.ca/rtr-sandbox
  tags:
  - Real-Time Rail
  - Payments
  - ISO 20022
  properties:
  - type: OpenAPI
    url: openapi/rtr-inbound-participant-payment-api-openapi.yml
  - type: Overlay
    url: overlays/rtr-inbound-participant-payment-api-overlay.yaml
  - type: Documentation
    url: https://developer.payments.ca/rtr-sandbox-api/apis
  - type: APIReference
    url: https://storage.googleapis.com/prod-apigee-bucket-swagger/index.html
